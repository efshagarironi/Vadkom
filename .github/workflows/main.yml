              // ================= dock =================
              View buildDock(final int num, int fg) {
                  if (!sp.getBoolean("dockOn" + num, true)) {
                      if (num == 1) dockHolder1 = null; else dockHolder2 = null;
                      return null;
                  }
                  FrameLayout holder = new FrameLayout(this);
                  if (num == 1) dockHolder1 = holder; else dockHolder2 = holder;
                  fillDock(num);
                  return holder;
              }

              void fillDock(final int num) {
                  final FrameLayout holder = (num == 1) ? dockHolder1 : dockHolder2;
                  if (holder == null) return;
                  holder.removeAllViews();
                  final int count = sp.getInt("dockCount" + num, 4);
                  final int pages = sp.getInt("dockPages" + num, 1);
                  int h = sp.getInt("dockH" + num, 90);
                  int alpha = sp.getInt("dockA" + num, 25);
                  int iconSz = sp.getInt("dockI" + num, 52);
                  int wPct = sp.getInt("dockW" + num, 96);
                  int sw = getResources().getDisplayMetrics().widthPixels - dp(24);
                  final int pageW = (int) (sw * wPct / 100f);
                  FrameLayout box = new FrameLayout(this);
                  GradientDrawable g = new GradientDrawable();
                  g.setCornerRadius(dp(36));
                  g.setColor(((alpha * 255 / 100) << 24) | 0x00FFFFFF);
                  g.setStroke(dp(1), 0x22FFFFFF);
                  box.setBackground(g);
                  final HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  hs.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);
                  LinearLayout rowL = new LinearLayout(this);
                  rowL.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);
                  int total = 0;
                  int sz = Math.max(dp(16), Math.min(dp(iconSz), pageW / count - dp(6)));
                  for (int pi = 0; pi < pages; pi++) {
                      LinearLayout pg = new LinearLayout(this);
                      pg.setGravity(Gravity.CENTER_VERTICAL);
                      final List<String> l = dockPageList(num, pi);
                      for (int k = 0; k < count; k++) {
                          FrameLayout slot = new FrameLayout(this);
                          if (k < l.size()) {
                              final String e = l.get(k);
                              View iv = null;
                              String nm = e;
                              if (e.startsWith("folder:")) {
                                  final Item f = findFolder(e.substring(7));
                                  if (f != null) {
                                      iv = folderBox(f, sz);
                                      iv.setOnClickListener(w -> openFolderFrom(w, f.id));
                                      nm = folderTitle(f);
                                  }
                              } else if (installed(e)) {
                                  ImageView im = styleAppIcon(icon(e), sz);
                                  im.setOnClickListener(w -> launchApp(e));
                                  iv = im;
                                  nm = label(e);
                              }
                              if (iv != null) {
                                  total++;
                                  final String title = nm;
                                  iv.setOnLongClickListener(w -> {
                                      new AlertDialog.Builder(this).setTitle(t("حذف از دوک؟", "Remove from dock?"))
                                              .setMessage(title)
                                              .setPositiveButton(t("حذف", "Remove"), (d, x) -> {
                                                  l.remove(e);
                                                  saveDock(num);
                                                  fillDock(num);
                                              }).setNegativeButton(t("لغو", "Cancel"), null).show();
                                      return true;
                                  });
                                  slot.addView(iv, new FrameLayout.LayoutParams(sz, sz, Gravity.CENTER));
                              }
                          }
                          pg.addView(slot, new LinearLayout.LayoutParams(0, -1, 1));
                      }
                      rowL.addView(pg, new LinearLayout.LayoutParams(pageW, -1));
                  }
                  hs.addView(rowL);
                  hs.setOnTouchListener((w, ev) -> {
                      int a = ev.getAction();
                      if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                          w.postDelayed(() -> {
                              int p = Math.round(hs.getScrollX() / (float) pageW);
                              if (num == 1) dockPage1 = Math.max(0, Math.min(pages - 1, p));
                              else dockPage2 = Math.max(0, Math.min(pages - 1, p));
                              hs.smoothScrollTo((num == 1 ? dockPage1 : dockPage2) * pageW, 0);
                          }, 100);
                      }
                      return false;
                  });
                  hs.post(() -> hs.scrollTo(Math.min(num == 1 ? dockPage1 : dockPage2, pages - 1) * pageW, 0));
                  box.addView(hs, new FrameLayout.LayoutParams(-1, -1));
                  if (total == 0) {
                      TextView hint = new TextView(this);
                      hint.setText(t("برنامه یا پوشه را نگه دارید و اینجا بکشید", "Hold an app or folder and drag it here"));
                      hint.setTextSize(12);
                      hint.setTextColor(fgc);
                      hint.setAlpha(0.6f);
                      box.addView(hint, new FrameLayout.LayoutParams(-2, -2, Gravity.CENTER));
                  }
                  box.setOnDragListener((w, ev) -> {
                      switch (ev.getAction()) {
                          case DragEvent.ACTION_DRAG_STARTED:
                              return true;
                          case DragEvent.ACTION_DRAG_ENTERED:
                              w.setAlpha(0.7f);
                              return true;
                          case DragEvent.ACTION_DRAG_EXITED:
                          case DragEvent.ACTION_DRAG_ENDED:
                              w.setAlpha(1f);
                              if (trashBtn != null) trashBtn.setAlpha(0f);
                              return true;
                          case DragEvent.ACTION_DROP:
                              w.setAlpha(1f);
                              addToDock(num, ev.getClipData().getItemAt(0).getText().toString());
                              return true;
                      }
                      return false;
                  });
                  holder.addView(box, new FrameLayout.LayoutParams(pageW, dp(h), Gravity.CENTER_HORIZONTAL));
              }

              void addToDock(int num, String payload) {
                  List<List<String>> d1 = dock1, d2 = dock2;
                  String entry = payload.startsWith("app:") ? payload.substring(4) : payload;

                  if (payload.startsWith("folder:")) {
                      Item f = findFolder(payload.substring(7));
                      if (f != null) home.remove(f);
                  }

                  int count = sp.getInt("dockCount" + num, 4), pages = sp.getInt("dockPages" + num, 1);
                  for (List<String> l : d1) {
                      if (l.contains(entry)) {
                          Toast.makeText(this, t("قبلاً در دوک ۱ هست", "Already in dock 1"), Toast.LENGTH_SHORT).show();
                          return;
                      }
                  }
                  for (List<String> l : d2) {
                      if (l.contains(entry)) {
                          Toast.makeText(this, t("قبلاً در دوک ۲ هست", "Already in dock 2"), Toast.LENGTH_SHORT).show();
                          return;
                      }
                  }
                  int curPage = (num == 1) ? dockPage1 : dockPage2;
                  List<String> l = dockPageList(num, Math.min(curPage, pages - 1));
                  if (l.size() >= count) {
                      Toast.makeText(this, t("این صفحه دوک پر است", "This dock page is full"), Toast.LENGTH_SHORT).show();
                      return;
                  }
                  l.add(entry);
                  saveHome();
                  saveDock(num);
                  postShow();
              }

              // ================= launching =================
              void launchApp(String pkg) {
                  Intent li = getPackageManager().getLaunchIntentForPackage(pkg);
                  if (li == null) return;
                  startActivity(li);
                  int mode = sp.getInt("mode", 0);
                  if (mode == 0) {
                      finish();
                  } else if (mode == 2) {
                      finishAndRemoveTask();
                      android.os.Process.killProcess(android.os.Process.myPid());
                      System.exit(0);
                  }
              }

