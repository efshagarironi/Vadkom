          cat > app/src/main/res/drawable/ic_gear.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_plus.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M19,13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_back.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z"/>
          </vector>
          EOF

          cat > app/src/main/java/com/mylauncher/VadTile.java <<'EOF'
          package com.mylauncher;

          import android.app.PendingIntent;
          import android.content.Intent;
          import android.os.Build;
          import android.service.quicksettings.Tile;
          import android.service.quicksettings.TileService;

          public class VadTile extends TileService {
              void upd() {
                  Tile t = getQsTile();
                  if (t == null) return;
                  boolean open = getSharedPreferences("l", 0).getBoolean("open", false);
                  t.setState(open ? Tile.STATE_ACTIVE : Tile.STATE_INACTIVE);
                  t.setLabel("Vad");
                  t.updateTile();
              }

              @Override
              public void onStartListening() { upd(); }

              @Override
              public void onClick() {
                  Tile t = getQsTile();
                  if (t != null) { t.setState(Tile.STATE_ACTIVE); t.updateTile(); }
                  Intent i = new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  if (Build.VERSION.SDK_INT >= 34) {
                      startActivityAndCollapse(PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_IMMUTABLE));
                  } else {
                      startActivityAndCollapse(i);
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/mylauncher/ColorPicker.java <<'EOF'
          package com.mylauncher;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Shader;
          import android.view.MotionEvent;
          import android.view.View;

          public class ColorPicker extends View {
              public interface Listener { void onColor(int c); }

              float h = 0, s = 1, v = 1, side = 100;
              int a = 255, mode = 0;
              Listener l;
              Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

              public ColorPicker(Context c) { super(c); }

              public void setListener(Listener x) { l = x; }

              public void setColor(int c) {
                  float[] hsv = new float[3];
                  Color.colorToHSV(c, hsv);
                  h = hsv[0];
                  s = hsv[1];
                  v = hsv[2];
                  a = Color.alpha(c);
                  invalidate();
              }

              public int getColor() { return Color.HSVToColor(a, new float[]{h, s, v}); }

              float dp(float x) { return x * getResources().getDisplayMetrics().density; }

              float clamp(float f) { return Math.max(0f, Math.min(1f, f)); }

              @Override
              protected void onMeasure(int ws, int hs) {
                  int w = MeasureSpec.getSize(ws);
                  float sd = w - dp(46);
                  setMeasuredDimension(w, (int) (sd + dp(18) + dp(28) + dp(4)));
              }

              @Override
              protected void onDraw(Canvas c) {
                  float w = getWidth();
                  side = w - dp(46);
                  float hx = side + dp(14);
                  float ay = side + dp(18);
                  int hueCol = Color.HSVToColor(new float[]{h, 1f, 1f});

                  p.setStyle(Paint.Style.FILL);
                  p.setShader(new LinearGradient(0, 0, side, 0, Color.WHITE, hueCol, Shader.TileMode.CLAMP));
                  c.drawRoundRect(0, 0, side, side, dp(8), dp(8), p);
                  p.setShader(new LinearGradient(0, 0, 0, side, 0x00000000, 0xFF000000, Shader.TileMode.CLAMP));
                  c.drawRoundRect(0, 0, side, side, dp(8), dp(8), p);

                  int[] cols = new int[7];
                  for (int i = 0; i < 7; i++) cols[i] = Color.HSVToColor(new float[]{i * 60f, 1f, 1f});
                  p.setShader(new LinearGradient(0, 0, 0, side, cols, null, Shader.TileMode.CLAMP));
                  c.drawRoundRect(hx, 0, w, side, dp(8), dp(8), p);

                  p.setShader(null);
                  float cell = dp(7);
                  c.save();
                  c.clipRect(0, ay, w, ay + dp(28));
                  for (int i = 0; i * cell < w; i++) {
                      for (int j = 0; j < 4; j++) {
                          p.setColor(((i + j) % 2 == 0) ? 0xFFFFFFFF : 0xFFBBBBBB);
                          c.drawRect(i * cell, ay + j * cell, (i + 1) * cell, ay + (j + 1) * cell, p);
                      }
                  }
                  int solid = Color.HSVToColor(255, new float[]{h, s, v});
                  p.setShader(new LinearGradient(0, 0, w, 0, solid & 0x00FFFFFF, solid, Shader.TileMode.CLAMP));
                  c.drawRect(0, ay, w, ay + dp(28), p);
                  c.restore();
                  p.setShader(null);

                  p.setStyle(Paint.Style.STROKE);
                  float cx = s * side, cy = (1 - v) * side;
                  p.setStrokeWidth(dp(3));
                  p.setColor(0xFFFFFFFF);
                  c.drawCircle(cx, cy, dp(9), p);
                  p.setStrokeWidth(dp(1));
                  p.setColor(0xFF000000);
                  c.drawCircle(cx, cy, dp(10.5f), p);

                  float hy = h / 360f * side;
                  p.setStrokeWidth(dp(4));
                  p.setColor(0xFFFFFFFF);
                  c.drawLine(hx, hy, w, hy, p);
                  p.setStrokeWidth(dp(1));
                  p.setColor(0xFF000000);
                  c.drawLine(hx, hy - dp(2.5f), w, hy - dp(2.5f), p);
                  c.drawLine(hx, hy + dp(2.5f), w, hy + dp(2.5f), p);

                  float ax = a / 255f * w;
                  p.setStrokeWidth(dp(4));
                  p.setColor(0xFFFFFFFF);
                  c.drawLine(ax, ay, ax, ay + dp(28), p);
                  p.setStrokeWidth(dp(1));
                  p.setColor(0xFF000000);
                  c.drawLine(ax - dp(2.5f), ay, ax - dp(2.5f), ay + dp(28), p);
                  c.drawLine(ax + dp(2.5f), ay, ax + dp(2.5f), ay + dp(28), p);
                  p.setStyle(Paint.Style.FILL);
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  float w = getWidth();
                  float x = e.getX(), y = e.getY();
                  if (e.getAction() == MotionEvent.ACTION_DOWN) {
                      if (getParent() != null) getParent().requestDisallowInterceptTouchEvent(true);
                      if (y > side + dp(8)) mode = 2;
                      else if (x > side + dp(6)) mode = 1;
                      else mode = 0;
                  }
                  if (mode == 0) {
                      s = clamp(x / side);
                      v = 1 - clamp(y / side);
                  } else if (mode == 1) {
                      h = clamp(y / side) * 359.99f;
                  } else {
                      a = (int) (clamp(x / w) * 255);
                  }
                  invalidate();
                  if (l != null) l.onColor(getColor());
                  return true;
              }
          }
          EOF

          cat > app/src/main/java/com/mylauncher/MainActivity.java <<'EOF'
          package com.mylauncher;

          import android.app.*;
          import android.content.*;
          import android.content.pm.*;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.os.*;
          import android.service.quicksettings.TileService;
          import android.text.*;
          import android.util.DisplayMetrics;
          import android.view.*;
          import android.view.animation.*;
          import android.widget.*;
          import java.util.*;
          import java.util.function.IntConsumer;
          import org.json.*;

          public class MainActivity extends Activity {
              static final int HOME = 0, SETTINGS = 1, BG = 2, BEHAVIOR = 3, LANG = 4, PICKER = 5,
                      DOCK = 6, ICON = 8;
              static final int DLG = 0xFFEEEEEE;

              static class AppItem { String label, pkg; Drawable icon; }

              static class Item {
                  boolean folder;
                  String pkg, id, name = "";
                  int color = 0x3A28282C;
                  List<String> apps = new ArrayList<>();
              }

              SharedPreferences sp;
              int bg, fgc, page = HOME, dockPage1 = 0, dockPage2 = 0, shownPage = -1, openCx, openCy;
              boolean fa, plusOpen = false, editName = false, folderSettings = false,
                      animFolder = false, animSettings = false, compact = false;
              View trashBtn;
              final int[] colors = {0xFF19191C, 0xFF222226, 0xFF121214, 0xFF000000,
                      0xFF1B2A3A, 0xFF1E3326, 0xFF3B1F24, 0xFF2E2140};
              final int[] fcolors = {0x3A28282C, 0x66000000, 0x66E53935, 0x66FB8C00, 0x66FDD835, 0x6643A047,
                      0x6600ACC1, 0x661E88E5, 0x665E35B1, 0x66D81B60, 0x668D6E63, 0x6690A4AE};

              FrameLayout container;
              View curPanel, normalBar, selBar;
              TextView selCount;
              FrameLayout dockHolder1, dockHolder2;

              List<Item> home = new ArrayList<>();
              List<List<String>> dock1 = new ArrayList<>();
              List<List<String>> dock2 = new ArrayList<>();
              Set<String> sel = new LinkedHashSet<>();
              Map<String, View> cells = new HashMap<>();
              String openFolder = null, pickTarget = null;

              List<AppItem> allApps = new ArrayList<>();
              List<String> added = new ArrayList<>();
              Set<String> selected = new LinkedHashSet<>();
              String query = "";
              LinearLayout listBox;
              TextView allText;
              View allDot;
              Button addBtn;

              String t(String f, String e) { return fa ? f : e; }

              // ================= lifecycle =================
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("l", 0);
                  fa = sp.getString("lang", "fa").equals("fa");
                  bg = sp.getInt("bg", colors[0]);
                  getWindow().setBackgroundDrawable(new ColorDrawable(bg));
                  container = new FrameLayout(this);
                  setContentView(container);
                  if (Build.VERSION.SDK_INT >= 33 &&
                          checkSelfPermission("android.permission.POST_NOTIFICATIONS")
                                  != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
                  loadHome();
                  loadDock(1);
                  loadDock(2);
                  notifyBar();
                  show();
              }

              @Override
              protected void onNewIntent(Intent in) {
                  super.onNewIntent(in);
                  setIntent(in);
                  page = HOME;
                  openFolder = null;
                  plusOpen = false;
                  folderSettings = false;
                  sel.clear();
                  show();
              }

              @Override
              public void onRequestPermissionsResult(int c, String[] p, int[] r) { notifyBar(); }

              @Override
              protected void onStart() {
                  super.onStart();
                  sp.edit().putBoolean("open", true).apply();
                  requestTile();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  sp.edit().putBoolean("open", false).apply();
                  requestTile();
              }

              @Override
              public void onBackPressed() {
                  if (page == HOME) {
                      if (!sel.isEmpty()) { sel.clear(); refreshCells(); updateSel(); }
                      else if (plusOpen) { plusOpen = false; show(); }
                      else if (openFolder != null) closeFolder();
                      else super.onBackPressed();
                  } else if (page == SETTINGS) {
                      page = HOME;
                      show();
                  } else if (page == PICKER) {
                      pickTarget = null;
                      page = HOME;
                      show();
                  } else {
                      page = SETTINGS;
                      show();
                  }
              }

              void requestTile() {
                  try {
                      TileService.requestListeningState(this, new ComponentName(this, VadTile.class));
                  } catch (Exception e) { }
              }

              void notifyBar() {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel("l", "VadLan",
                          NotificationManager.IMPORTANCE_LOW));
                  Intent i = new Intent(this, MainActivity.class)
                          .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, i,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new Notification.Builder(this, "l")
                          .setSmallIcon(R.drawable.ic_tile)
                          .setContentTitle("VadLan")
                          .setContentText(t("برای باز کردن لمس کنید", "Tap to open"))
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .build();
                  nm.notify(1, n);
              }

              // ================= data =================
              void loadHome() {
                  home.clear();
                  String s = sp.getString("home", null);
                  try {
                      if (s != null) {
                          JSONArray a = new JSONArray(s);
                          for (int i = 0; i < a.length(); i++) {
                              JSONObject o = a.getJSONObject(i);
                              Item it = new Item();
                              if (o.has("id")) {
                                  it.folder = true;
                                  it.id = o.getString("id");
                                  it.name = o.optString("n", "");
                                  it.color = o.optInt("c", 0x3A28282C);
                                  JSONArray ar = o.getJSONArray("a");
                                  for (int j = 0; j < ar.length(); j++) it.apps.add(ar.getString(j));
                              } else {
                                  it.pkg = o.getString("p");
                              }
                              home.add(it);
                          }
                      } else {
                          for (String x : sp.getString("apps", "").split(",")) {
                              if (x.isEmpty()) continue;
                              Item it = new Item();
                              it.pkg = x;
                              home.add(it);
                          }
                      }
                  } catch (Exception e) { }
              }

              void saveHome() {
                  try {
                      JSONArray a = new JSONArray();
                      for (Item it : home) {
                          JSONObject o = new JSONObject();
                          if (it.folder) {
                              o.put("id", it.id);
                              o.put("n", it.name);
                              o.put("c", it.color);
                              JSONArray ar = new JSONArray();
                              for (String p : it.apps) ar.put(p);
                              o.put("a", ar);
                          } else {
                              o.put("p", it.pkg);
                          }
                          a.put(o);
                      }
                      sp.edit().putString("home", a.toString()).apply();
                  } catch (Exception e) { }
              }

              void loadDock(int num) {
                  List<List<String>> d = (num == 1) ? dock1 : dock2;
                  d.clear();
                  String s = sp.getString("dock" + num, "");
                  for (String pg : s.split(";", -1)) {
                      List<String> l = new ArrayList<>();
                      for (String x : pg.split(",")) if (!x.isEmpty()) l.add(x);
                      d.add(l);
                  }
              }

              void saveDock(int num) {
                  List<List<String>> d = (num == 1) ? dock1 : dock2;
                  StringBuilder b = new StringBuilder();
                  for (int i = 0; i < d.size(); i++) {
                      if (i > 0) b.append(';');
                      b.append(String.join(",", d.get(i)));
                  }
                  sp.edit().putString("dock" + num, b.toString()).apply();
              }

              List<String> dockPageList(int num, int i) {
                  List<List<String>> d = (num == 1) ? dock1 : dock2;
                  while (d.size() <= i) d.add(new ArrayList<String>());
                  return d.get(i);
              }

              Item findFolder(String id) {
                  for (Item it : home) if (it.folder && it.id.equals(id)) return it;
                  for (List<String> pg : dock1) {
                      for (String e : pg) {
                          if (e.startsWith("folder:") && e.substring(7).equals(id)) return new Item();
                      }
                  }
                  for (List<String> pg : dock2) {
                      for (String e : pg) {
                          if (e.startsWith("folder:") && e.substring(7).equals(id)) return new Item();
                      }
                  }
                  return null;
              }

              String folderTitle(Item f) {
                  if (f == null) return "?";
