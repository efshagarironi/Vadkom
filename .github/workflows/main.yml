              void makeDropTarget(View c, final Item target) {
                  c.setOnDragListener((w, ev) -> {
                      switch (ev.getAction()) {
                          case DragEvent.ACTION_DRAG_STARTED:
                              return true;
                          case DragEvent.ACTION_DRAG_ENTERED:
                              w.setAlpha(0.55f);
                              return true;
                          case DragEvent.ACTION_DRAG_EXITED:
                          case DragEvent.ACTION_DRAG_ENDED:
                              w.setAlpha(1f);
                              if (trashBtn != null) trashBtn.setAlpha(0f);
                              return true;
                          case DragEvent.ACTION_DROP:
                              w.setAlpha(1f);
                              dropOnItem(ev.getClipData().getItemAt(0).getText().toString(), target);
                              return true;
                      }
                      return false;
                  });
              }

              void dropOnItem(String payload, Item target) {
                  if (payload.startsWith("folder:")) {
                      Item d = findFolder(payload.substring(7));
                      if (d == null || d == target) return;
                      home.remove(d);
                      home.add(Math.max(0, home.indexOf(target)), d);
                  } else {
                      final String p = payload.substring(4);
                      if (!target.folder && p.equals(target.pkg)) return;
                      for (Item it : home) if (it.folder) it.apps.remove(p);
                      home.removeIf(q -> !q.folder && p.equals(q.pkg));
                      if (target.folder) {
                          if (!target.apps.contains(p)) target.apps.add(p);
                      } else {
                          Item a = new Item();
                          a.pkg = p;
                          home.add(Math.max(0, home.indexOf(target)), a);
                      }
                  }
                  sel.clear();
                  saveHome();
                  postShow();
              }

              View trashView() {
                  TextView tr = new TextView(this);
                  tr.setText("🗑");
                  tr.setTextSize(18);
                  tr.setGravity(Gravity.CENTER);
                  tr.setBackground(oval(0x44888888));
                  tr.setAlpha(0f);
                  tr.setOnDragListener((w, ev) -> {
                      switch (ev.getAction()) {
                          case DragEvent.ACTION_DRAG_STARTED:
                              w.setAlpha(0.8f);
                              return true;
                          case DragEvent.ACTION_DRAG_ENTERED:
                              w.setScaleX(1.3f);
                              w.setScaleY(1.3f);
                              w.setAlpha(1f);
                              return true;
                          case DragEvent.ACTION_DRAG_EXITED:
                              w.setScaleX(1f);
                              w.setScaleY(1f);
                              w.setAlpha(0.8f);
                              return true;
                          case DragEvent.ACTION_DRAG_ENDED:
                              w.setAlpha(0f);
                              w.setScaleX(1f);
                              w.setScaleY(1f);
                              return true;
                          case DragEvent.ACTION_DROP:
                              trashDrop(ev.getClipData().getItemAt(0).getText().toString());
                              return true;
                      }
                      return false;
                  });
                  return tr;
              }

              void trashDrop(String payload) {
                  if (payload.startsWith("app:")) {
                      final String p = payload.substring(4);
                      for (Item it : home) if (it.folder) it.apps.remove(p);
                      home.removeIf(q -> !q.folder && p.equals(q.pkg));
                      for (List<String> l : dock1) l.remove(p);
                      for (List<String> l : dock2) l.remove(p);
                      saveHome();
                      saveDock(1);
                      saveDock(2);
                      postShow();
                  } else {
                      final Item f = findFolder(payload.substring(7));
                      if (f == null) return;
                      if (f.apps.isEmpty()) {
                          deleteFolder(f, false);
                          return;
                      }
                      new AlertDialog.Builder(this).setTitle(t("حذف پوشه", "Delete folder"))
                              .setMessage(t("با برنامه‌های داخل پوشه چه کنم؟", "What should happen to the apps inside?"))
                              .setPositiveButton(t("حذف با برنامه‌ها", "Delete with apps"), (d, w) -> deleteFolder(f, false))
                              .setNeutralButton(t("انتقال برنامه‌ها به صفحه اصلی", "Move apps to home"), (d, w) -> deleteFolder(f, true))
                              .setNegativeButton(t("لغو", "Cancel"), null).show();
                  }
              }

              void deleteFolder(Item f, boolean keepApps) {
                  int idx = home.indexOf(f);
                  home.remove(f);
                  if (keepApps) {
                      List<Item> back = new ArrayList<>();
                      for (String p : f.apps) {
                          Item a = new Item();
                          a.pkg = p;
                          back.add(a);
                      }
                      home.addAll(Math.max(0, Math.min(idx, home.size())), back);
                  }
                  for (List<String> l : dock1) l.remove("folder:" + f.id);
                  for (List<String> l : dock2) l.remove("folder:" + f.id);
                  if (f.id.equals(openFolder)) openFolder = null;
                  saveHome();
                  saveDock(1);
                  saveDock(2);
                  postShow();
              }

