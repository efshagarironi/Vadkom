              void updateSel() {
                  boolean on = !sel.isEmpty();
                  normalBar.setVisibility(on ? View.GONE : View.VISIBLE);
                  selBar.setVisibility(on ? View.VISIBLE : View.GONE);
                  if (on) selCount.setText(String.valueOf(sel.size()));
