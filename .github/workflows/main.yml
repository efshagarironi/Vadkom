              void closeFolder() {
                  if (curPanel != null) {
                      View p = curPanel;
                      curPanel = null;
                      p.animate().scaleX(0.15f).scaleY(0.15f).alpha(0f).setDuration(200)
                              .withEndAction(() -> {
                                  openFolder = null;
